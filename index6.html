<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <form action="index5.html" method="post">
        <label for="nomeCompleto">Nome Completo</label>
        <input type="text" id="nomeCompleto" name="nomeCompleto">

        <label>
            E-mail
            <input type="email" name="emailDoUsuario">
        </label>
        <label for="dataNascimento">Data de Nascimento</label>
        <input type="date" id="data de nascimento" name="dataNascimento">

        <label for="idade">Idade</label>
        <input type="number" id="idade" name="idade">

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha">

        <label for="curriculo">Currículo</label>
        <input type="file" id="curriculo" name="curriculo" accepet=".pdf">

        <label for="Range">Range</label>
        <input type="range" min="0" max="10" steep="2"
        id="range" name="range">
        
        
        <br>

        <!--Checkbox-->

        <p>Quais tecnologias você conhece?</p>
        <label>
            <input type="checkbox" name="tecnologia"
            value="html">
        HTML
        </label>
        <label>
            <input type="checkbox" name="tecnologia" value="css">
        CSS
        </label>
        <label>
            <input type="checkbox" name="tecnologia" value="js">
        JavaScript
        </label>
        <p>Qual é o seu turno de estudo?</p>
        <label>
            <input type="radio" name="turno" value="manha">
            Manhã
        </label>
        <label>
            <input type="radio" name="turno" value="tarde">
            Tarde
        </label>  
        <label>
            <input type="radio" name="turno" value="noite">
            noite
        </label>
        <label for="curso">Curso</label>
        <select id="curso" name="curso">
            <option value="">Selecione...</option>
            <option value="informatica">Informática</option>
            <optgroup label="Gestão">
                <option value="adm">Administração</option>
                <option value="contabeis">Ciências contabeis</option>

            </optgroup>
        </select>
        <label for="cidade"></label>
        <input list="cidades" id="cidade" name="cidade">
            <datalist id="cidades">
                <options value="Chapecó">
                <options value="Joinvile">
                <options value="Florianópolis">
                
            </datalist>

        <button type="submit">Enviar</button>

    </form>
    
</body>
</html>
